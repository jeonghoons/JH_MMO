; GameServer 운영 설정 (개발용 값). 게임 수치는 Common/DataTable/*.csv에 둔다.
; 우선순위: 코드 기본값 -> 이 파일 -> ServerConfig.local.ini(있으면, 커밋하지 않음) -> 환경변수 -> 명령줄
; 비밀번호가 필요한 DB는 이 파일에 쓰지 말고 환경변수 JH_DB_CONNECTION으로 준다.
; 값 뒤에는 주석을 달 수 없다(연결 문자열에 ';'가 들어가기 때문).

[Network]
; 다른 PC에서 접속(원격 부하 테스트)하려면 0.0.0.0
BindIp=127.0.0.1
; 명령줄 --port 로 덮어쓸 수 있다
Port=8888
; IOCP 워커 스레드 수. 0이면 CPU 코어 수 / 2
WorkerThreads=0
; 송신 묶기(P1b): 방 작업에서 한 세션에 보내는 WSASend 사이의 최소 간격(ms). 한동안 보낸 것이 없던 세션은 바로 보내고,
; 방금 보낸 세션에 가는 메시지만 이 시간만큼 모아 한 번에 보낸다. 0이면 작업이 끝날 때마다 바로 보낸다
SendFlushIntervalMs=10
; Windows 타이머 해상도(ms). 0이면 건드리지 않는다(시스템 기본 약 15.6ms). 1이면 예약 작업(방 틱·송신 깨우기)이 1ms 단위로 깬다
TimerResolutionMs=1
; 공격 허용 오차(CP1, D-213): 앞 동작·스킬 쿨타임이 이 시간(ms) 이하로 남았을 때 온 공격 요청을 받는다(지연이 흔들려 조금 일찍 온 요청).
; 일찍 받은 만큼 다음 잠금·쿨타임에 더하므로 공격 주기는 빨라지지 않는다. 0이면 끔(정확히 판정)
AttackEarlyToleranceMs=100
; 중복 접속 차단(A2.7): 같은 캐릭터의 이전 접속 정리(퇴장·마지막 저장)를 기다리는 시간(초). 넘으면 로그인에 BUSY로 응답한다
LoginWaitTimeoutSec=10
; 정리가 끝났다는 신호가 이 시간(초) 안에 오지 않으면 오류 로그를 남기고 접속 목록에서 강제로 뺀다(안전장치)
LoginCloseForceSec=30
; 유휴 타임아웃(A5.0, D-220): 이 시간(초) 동안 아무 패킷도 받지 못한 연결을 끊는다(5초마다 검사, 로그인 전 연결 포함). 0이면 끔.
; 클라이언트는 연결된 동안 5초마다 CS_PING을 보내므로 정상 연결은 걸리지 않는다
IdleTimeoutSec=60
; 송신 큐 상한(A5.0, D-221): 세션 하나의 송신 큐에 쌓인 패킷이 이 수를 넘으면 끊는다(받지 않는 클라이언트 대책). 0이면 끔.
; 정상 세션의 최대치는 한 화면 인원과 비슷하다(측정 최대 399 — 마을에 500명)
SendQueueLimit=4000

[Database]
ConnectionString=Driver={ODBC Driver 17 for SQL Server};Server=.\SQLEXPRESS;Database=GameServer;Trusted_Connection=Yes;
; DB 연결(= DB 작업 스레드) 수
Connections=4
; 진행 상황(레벨·경험치·HP·골드) 주기 저장 간격(초). 값이 달라진 플레이어만 저장한다. 접속 종료 때는 간격과 상관없이 저장한다
PlayerSaveIntervalSec=60
; 경매 혼잡 기준(D-235): 경매 종류의 DB 작업(등록·구매·취소·수령·수령함 읽기·만료 묶음)이 이 수를 넘게 진행 중이면
; 새 경매 요청을 "잠시 뒤에 다시"(AUCTION_RESULT_TRY_LATER)로 거부한다. 0 = 끔. PL1·A5.4 측정으로 조정한다
AuctionDbMaxInFlight=16

[Log]
; Debug / Info / Warn / Error. Debug는 접속·입장·피해 등 플레이어마다 남는 로그까지 출력
Level=Info
; 로그 파일 폴더(작업 폴더 기준). 실행할 때마다 GameServer_<시작시각>.log 하나. 비우면 콘솔만
Dir=../PerfData/2026-11-24_A5.1/runs/ramp1000_hunt/logs

[World]
; 이 서버가 띄우는 레벨. 맵 리소스 파일 이름(Resource/Map/<이름>_Geo.nav, ../MapResource/Export/<이름>)이자 WorldTable.csv의 MapName과 같아야 한다
MapName=Continent01
; Room 이동(문 포털·사냥터에서 죽은 뒤 부활) 전에 끝나지 않은 DB 작업을 기다리는 최대 시간(ms). 넘으면 이동을 취소하고 다시 시도하라고 알린다
MoveWaitTimeoutMs=5000
; 던전 인스턴스 수의 서버 전체 상한. 넘으면 새 인스턴스를 만들지 않는다(입장 거부: 던전이 가득 참)
MaxDungeonInstances=250
; 다른 레벨(던전)로 옮긴 클라이언트가 레벨을 다 열 때까지 기다리는 최대 시간(초). 넘으면 접속을 끊는다
LoadTimeoutSec=60

[Debug]
; 부하 시험용(더미 봇 로그인에만 적용). x,y,r[,n];... (cm) — 들어오는 순서대로 앞 구역부터 n명씩 배치(n 없으면 나머지 전부). 비우면 맵 전체 무작위
DummySpawnZone=
; 방마다 1초에 한 번 시야 목록을 실제 거리(WorldTable ViewRadiusCm/ViewHysteresisCm)와 비교해 [metrics] viewAudit에 집계
ViewAudit=false
; 시험용: 아이템 트랜잭션·진행 상황 저장을 실행하기 전에 이만큼(ms) 멈춘다(빠른 재접속·중복 접속·결과 도착 전 접속 해제 시험). 평소에는 0
DbSaveDelayMs=0
; 부하 시험용: 봇의 is_dummy 로그인(공용 dummy 계정)을 받는다. 꺼져 있으면 is_dummy 요청과 dummy 계정 로그인을 거부한다. 기본 false
AllowDummyLogin=true
; 부하 시험용: 더미 봇이 처음 들어가는 Room. town = 마을(실제 규칙), field = 사냥터에 바로, split = 번갈아, spread = 마을 DummyTownPercent% + 나머지는 사냥터 스폰 지점마다 고르게
DummyRoom=spread
; DummyRoom=spread일 때 마을에 넣는 비율(%)
DummyTownPercent=30
; 시험용: Room 이동의 잡 사이를 이만큼(ms) 늦춘다(그 구간의 접속 해제·사망·중복 요청 시험). 평소에는 0
MoveHandoffDelayMs=0
; 개발 지급 명령(CS_DEV_GIVE, 클라이언트 콘솔 Give)을 받는다. 꺼져 있으면 NOT_ALLOWED로 거부한다
DevCommands=false
; 포털 사용 요청의 거리 검사를 건너뛴다(시험용 — 같은 구역 Room 안이면 어디서든 그 포털을 쓸 수 있다). 기본 false
PortalNoRange=false
; 시험용: 0보다 크면 아이템 트랜잭션을 이 횟수마다 한 번 일부러 롤백한다(DB 실패 시 메모리·DB가 그대로인지 확인). 평소에는 0
DbItemFailEvery=0
