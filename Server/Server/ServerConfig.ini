; GameServer 운영 설정 (개발용 값). 게임 수치는 Common/DataTable/*.csv에 둔다.
; 우선순위: 코드 기본값 -> 이 파일 -> ServerConfig.local.ini(있으면, 커밋하지 않음) -> 환경변수 -> 명령줄
; 비밀번호가 필요한 DB는 이 파일에 쓰지 말고 환경변수 JH_DB_CONNECTION으로 준다.
; 값 뒤에는 주석을 달 수 없다(연결 문자열에 ';'가 들어가기 때문).

[Network]
; 다른 PC에서 접속(원격 부하 테스트)하려면 0.0.0.0
BindIp=127.0.0.1
; 명령줄 --port 로 덮어쓸 수 있다
Port=8888
; IOCP 워커 스레드 수. 0이면 CPU 코어 수 / 2
WorkerThreads=0

[Database]
ConnectionString=Driver={ODBC Driver 17 for SQL Server};Server=.\SQLEXPRESS;Database=GameServer;Trusted_Connection=Yes;
; DB 연결(= DB 작업 스레드) 수
Connections=4

[Log]
; Debug / Info / Warn / Error. Debug는 접속·입장·피해 등 플레이어마다 남는 로그까지 출력
Level=Info
; 로그 파일 폴더(작업 폴더 기준). 실행할 때마다 GameServer_<시작시각>.log 하나. 비우면 콘솔만
Dir=Logs

[Debug]
; 부하 시험용(더미 봇 로그인에만 적용). x,y,r[,n];... (cm) — 들어오는 순서대로 앞 구역부터 n명씩 배치(n 없으면 나머지 전부). 비우면 맵 전체 무작위
DummySpawnZone=
; 방마다 1초에 한 번 시야 목록을 실제 거리(WorldTable ViewRadiusCm/ViewHysteresisCm)와 비교해 [metrics] viewAudit에 집계
ViewAudit=false
