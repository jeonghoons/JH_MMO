syntax = "proto3";
package Protocol;

import "Enum.proto";

message PositionInfo {
	float x = 1;
	float y = 2;
	float z = 3;
	float yaw = 4;
	float v_x = 5;
	float v_y = 6;
	float v_z = 7;
	MoveState state = 8;
}

message StatInfo {
	int32 max_hp = 1;
	int32 hp = 2;
	int32 attack_damage = 3;
	float attack_speed = 4;
	float move_speed = 5;
	int32 max_mp = 6;         // 플레이어 최대 MP(PlayerStatTable.MaxMp + 장비). 몬스터는 0 (A2.3b, D-254)
	int32 mp = 7;             // 플레이어 MP. DB에 저장하지 않고 로그인 때 가득
}

message ObjectInfo {
	int32 id = 1;
	ObjectType object_type = 2;
	PlayerType player_type = 3;
	PositionInfo position = 4;
	StatInfo stat = 5;

	int32 template_id = 6;   // 몬스터 = MonsterTable ID(종류), NPC = NpcTable ID(종류, L4), 플레이어 = 0
	reserved 7;   // appearance_items (모듈러 외형 잔재, 2026-10-28 삭제)
	repeated int32 equip_items = 8;
	int32 aim_skill_id = 9;   // 스킬 조준 중인 스킬 ID(0 = 조준 안 함). 클라는 스폰(SC_ADD_OBJECT) 때만 읽는다
	string name = 10;         // 플레이어 캐릭터 이름(UTF-8). 몬스터는 빈 문자열
	int32 level = 11;         // 플레이어 레벨(1~30, 경험치로 오름 — A2.3b). 몬스터는 0
	int64 item_count = 12;    // 바닥 드랍(OBJECT_TYPE_ITEM)의 수량. template_id = ItemTable ID(0 = 골드, 이때는 금액). 그 밖은 0 (A3.4)
	NpcKind npc_kind = 13;    // NPC(OBJECT_TYPE_NPC)가 하는 일: 상점·경매. 그 밖은 0 (A4.3, D-234)
	int64 exp = 14;           // 지금 레벨 안의 누적 경험치. 본인에게 보내는 ObjectInfo(내 캐릭터 입장)에만 채우고 다른 사람에게는 0 (A2.3b, D-254)
}

// 아이템 한 개(스택이면 한 묶음) = DB Player_Item 한 행 (A3.3, D-153)
// 거래에 올린 아이템 하나 (A4.2). 스택의 일부만 올릴 수 있다
message TradeOfferItem {
	int64 item_db_id = 1;
	int32 item_id = 2;        // 표시용(ItemTable ID). 요청(CS_TRADE_SET_OFFER)에서는 보지 않는다
	int64 count = 3;          // 올린 수량 (1 ~ 그 행의 수량)
}

// 거래 한쪽의 제시 (A4.2)
message TradeOffer {
	int32 object_id = 1;                 // 이 제시를 올린 플레이어
	repeated TradeOfferItem items = 2;
	int64 gold = 3;
	bool locked = 4;
	bool confirmed = 5;
}

message ItemInfo {
	int64 item_db_id = 1;
	int32 item_id = 2;        // ItemTable ID
	int64 count = 3;
	EquipPart equip_part = 4; // 장착 중인 슬롯(1~7). 0 = 인벤토리
	int32 slot = 5;           // 인벤토리 칸 번호(0부터). 장착 중이면 -1. 서버가 DB(Player_Item.BagSlot)에 저장한다 (A6.1)
}

// 경매 등록 한 건 (A4.3, D-281). 검색 결과(SC_AUCTION_LIST)와 내 등록(SC_AUCTION_MY)에 쓴다
message AuctionListingInfo {
	int64 listing_id = 1;
	int32 item_id = 2;        // ItemTable ID
	int64 count = 3;          // 남은 수량 (부분 구매 가능)
	int64 unit_price = 4;     // 1개당 가격 (가격 = count × unit_price)
	int32 remain_sec = 5;     // 만료까지 남은 초 (0 = 곧 만료)
	bool mine = 6;            // 내가 올린 등록 (살 수 없음)
}

// 수령함 한 건 (A4.3). gold 또는 item 가운데 하나만 채워진다
message MailInfo {
	int64 mail_id = 1;
	MailKind kind = 2;
	int64 gold = 3;           // 판매 대금 (그 밖은 0)
	int32 item_id = 4;        // 아이템 종류 (판매 대금이면 0)
	int64 count = 5;          // 아이템 수량
	int64 listing_id = 6;     // 이 우편을 만든 등록
}

// 받은 퀘스트 하나의 상태 (Q1). 받지 않은 퀘스트는 목록에 없다
message QuestInfo {
	int32 quest_id = 1;       // QuestTable ID
	QuestState state = 2;
	int32 progress = 3;       // 처치형(Kill)의 처치 수(0 ~ QuestTable.Count). 수집형(Collect)은 항상 0 — 클라이언트가 인벤토리 수량으로 표시한다
}
