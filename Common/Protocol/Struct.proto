syntax = "proto3";
package Protocol;

import "Enum.proto";

message PositionInfo {
	float x = 1;
	float y = 2;
	float z = 3;
	float yaw = 4;
	float v_x = 5;
	float v_y = 6;
	float v_z = 7;
	MoveState state = 8;
}

message StatInfo {
	int32 max_hp = 1;
	int32 hp = 2;
	int32 attack_damage = 3;
	float attack_speed = 4;
	float move_speed = 5;
}

message ObjectInfo {
	int32 id = 1;
	ObjectType object_type = 2;
	PlayerType player_type = 3;
	PositionInfo position = 4;
	StatInfo stat = 5;

	int32 template_id = 6;
	reserved 7;   // appearance_items (모듈러 외형 잔재, 2026-10-28 삭제)
	repeated int32 equip_items = 8;
}


