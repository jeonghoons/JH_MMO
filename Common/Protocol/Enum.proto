syntax = "proto3";
package Protocol;

enum PacketId {
    PKT_NONE = 0;
    // 삭제한 패킷 번호는 재사용하지 않는다 (2026-10-28 정리: LOGOUT, CMOVE, LEAVE_ROOM)
    reserved 1002, 1005, 1007, 2002, 2007;
    
    // Client -> Server
    CS_LOGIN = 1000;
    CS_SIGNUP = 1001;
    CS_CHAT = 1003;
    CS_MOVE = 1004;
    CS_ENTER_ROOM = 1006;
    CS_ATTACK = 1008;
    CS_CHANGE_EQUIP = 1009;
    CS_PING = 1010;       // 부하 테스트/지연 측정용
    CS_SKILL_AIM = 1011;  // 스킬 조준 켜기/끄기 (상태가 바뀔 때만)
    CS_REVIVE = 1012;     // 부활 요청 (사망 후 대기 시간이 지나야 서버가 받는다)
    CS_PICKUP_ITEM = 1013; // 바닥 드랍 줍기 (A3.5)
    CS_DROP_ITEM = 1014;   // 인벤토리 아이템을 바닥에 버리기 (A3.5, D-155)
    CS_USE_ITEM = 1015;    // 소비 아이템 사용 (A3.6, D-154)
    CS_SET_QUICKSLOT = 1016; // 액티브 칸에 아이템 종류 올리기·비우기 (A3.6)
    CS_DEV_GIVE = 1017;   // 개발 지급 명령 (ServerConfig [Debug] DevCommands=true일 때만)
    // 1:1 거래 (A4.2, D-158). 같은 방의 두 플레이어, 모든 전이는 서버가 판정한다
    CS_TRADE_REQUEST = 1018;   // 거래 요청 (대상 오브젝트 id)
    CS_TRADE_RESPOND = 1019;   // 받은 요청에 수락·거절
    CS_TRADE_SET_OFFER = 1020; // 내 제시 전체를 교체 (아이템 목록 + 골드)
    CS_TRADE_LOCK = 1021;      // 내 제시 잠금·풀기
    CS_TRADE_CONFIRM = 1022;   // 확정 (양쪽 잠금 뒤에만)
    CS_TRADE_CANCEL = 1023;    // 취소 (요청 중·제시·잠금 어느 때나)
    // 경매장 (A4.3, D-159·D-234). 조회·구매·내 목록은 던전 밖 어디서나, 등록·취소·수령은 경매 NPC 근처에서만
    CS_AUCTION_SEARCH = 1024;   // 판매 중인 등록 검색 (슬롯 필터 + 쪽)
    CS_AUCTION_REGISTER = 1025; // 인벤토리 아이템을 경매에 등록 (스택 일부 가능)
    CS_AUCTION_BUY = 1026;      // 등록 하나를 통째로 즉시 구매 (산 물건은 수령함으로)
    CS_AUCTION_CANCEL = 1027;   // 내 등록 취소 (아이템은 수령함으로)
    CS_AUCTION_MY = 1028;       // 내 등록 + 수령함 조회
    CS_MAIL_CLAIM = 1029;       // 수령함에서 한 건 받기
    CS_MOVE_ITEM = 1030;  // 인벤토리 칸 옮기기·맞바꾸기 (A6.1)
    CS_SHOP_OPEN = 1031;  // 상점 NPC 품목 요청 (L4, D-202)
    CS_SHOP_BUY = 1032;   // 상점 구매
    CS_SHOP_SELL = 1033;  // 상점 판매
    CS_PORTAL = 1034;     // 포털 사용 요청 (L5, D-203)
    // 파티 (DG2, D-217). Room을 거치지 않고 WorldService가 처리한다
    CS_PARTY_INVITE = 1035;   // 파티 초대 (대상 오브젝트 id 또는 캐릭터 이름)
    CS_PARTY_RESPOND = 1036;  // 받은 초대에 수락·거절
    CS_PARTY_LEAVE = 1037;    // 파티 탈퇴
    // 퀘스트 (Q1, D-259·D-261). 수락·완료는 퀘스트 NPC 근처에서만. 목록 요청 패킷은 없다 — 처음 입장 때 서버가 SC_QUEST_LIST를 보낸다
    CS_QUEST_REQUEST = 1038;  // 퀘스트 요청 하나 — 서버가 상태로 수락·완료를 정함 (D-264). 1039는 사용 안 함(옛 완료 요청)

    // Server -> Client
    SC_LOGIN = 2000;
    SC_SIGNUP = 2001;
    SC_ADD_OBJECT = 2003;
    SC_REMOVE_OBJECT = 2004;
    SC_CHAT = 2005;
    SC_MOVE_OBJECT = 2006;
    SC_ATTACK = 2008;
    SC_DAMAGE = 2009;
    SC_DEAD = 2010;
    SC_CHANGE_EQUIP = 2011;
    SC_PONG = 2012;
    SC_CHANGE_EQUIP_RESULT = 2013;   // 장착 거부 결과 (본인에게만)
    SC_SKILL_AIM = 2014;             // 스킬 조준 상태 (AOI 방송, 거부·시간 초과는 본인에게 seq 포함)
    SC_REVIVE = 2015;                // 플레이어 부활 (AOI 방송, 본인 포함)
    SC_INVENTORY = 2016;             // 방 입장 직후 본인에게: 인벤토리·장착 전체 + 골드 + 칸 수 (A3.3)
    SC_INVENTORY_UPDATE = 2017;      // 본인에게: 바뀐 행·지워진 행·현재 골드 (A3.3)
    SC_ITEM_RESULT = 2018;           // 아이템 요청 거부 결과 (본인에게만, 거부일 때만)
    SC_USE_ITEM = 2019;              // 소비 아이템 사용 결과 (AOI, 본인 포함): 쓴 종류·사용 뒤 HP·재사용 시간 (A3.6)
    SC_TRADE_REQUEST = 2020;         // 거래 요청을 받은 쪽에게 (A4.2)
    SC_TRADE_STATE = 2021;           // 거래 상태 전체: 단계, 양쪽 제시·잠금·확정 (두 사람에게, 바뀔 때마다)
    SC_TRADE_END = 2022;             // 거래가 끝났다: 성사 또는 취소 사유 (두 사람에게)
    SC_TRADE_RESULT = 2023;          // 거래 요청 거부 결과 (본인에게, 거부일 때만. 확정 재검증 실패는 두 사람에게)
    SC_AUCTION_LIST = 2024;          // 검색 결과 한 쪽 (본인, A4.3)
    SC_AUCTION_MY = 2025;            // 내 등록 + 수령함 (본인)
    SC_AUCTION_RESULT = 2026;        // 경매 요청 결과 (본인, 성공·거부 모두): 요청 패킷 id + AuctionResult + 대상 id
    SC_KICK = 2027;                  // 서버가 연결을 끊기 직전 본인에게 (사유)
    SC_CHANGE_HP = 2028;             // 피해·아이템 사용이 아닌 HP 변화 (AOI): 몬스터가 홈으로 돌아가 회복 (L3, D-193)
    SC_SHOP_OPEN = 2029;             // 상점 품목·구매가 (본인, L4)
    SC_TELEPORT = 2030;              // 서버가 정한 자리로 순간이동 (AOI, 본인 포함): 포털 이동 (L5, D-203)
    SC_PORTAL_LIST = 2031;           // 방 입장 직후 본인에게: 쓸 수 있는 포털의 위치·반경 (L5)
    SC_ATTACK_RESULT = 2032;         // 스킬·공격 거부 결과 (본인에게만, 거부일 때만. 요청 seq 포함 — CP1, D-211)
    SC_PARTY_INVITE = 2033;          // 파티 초대를 받은 쪽에게 (DG2, D-217)
    SC_PARTY_STATE = 2034;           // 파티 전체(파티장·파티원 목록). 바뀔 때마다 전원에게, 파티원 0명 = 파티 없음
    SC_PARTY_RESULT = 2035;          // 파티 요청 거부·초대 결과 (본인에게)
    SC_ROOM_CHANGE = 2036;           // Room을 옮김(본인에게): 레벨·종류·채널·새 위치·이동 보정 순번 (DG3b, D-216)
    SC_MOVE_RESULT = 2037;           // Room 이동 거부(본인에게만, 거부일 때만)
    SC_DUNGEON_STATE = 2038;         // 던전 인스턴스 상태(안에 있는 사람에게): 입장 직후 한 번, 클리어 때 전원 (DG3c, D-218)
    // 성장·MP (A2.3b, D-253·D-254)
    SC_GAIN_EXP = 2039;              // 경험치를 얻음 (본인): 지금 레벨 안의 누적 경험치 + 이번에 얻은 양
    SC_LEVEL_UP = 2040;              // 레벨업 (AOI, 본인 포함): 새 레벨 + 새 스탯(HP·MP 가득)
    SC_CHANGE_MP = 2041;             // MP 변화 (본인): 스킬 소모·자연 회복
    // 퀘스트·수령함 알림 (Q1, D-259·D-261·D-262)
    SC_QUEST_LIST = 2042;            // 처음 입장 직후 본인에게: 받은 퀘스트 전부(진행 중 + 완료)
    SC_QUEST_UPDATE = 2043;          // 퀘스트 하나의 상태·진행이 바뀜 (본인): 수락·처치 인정·완료
    SC_QUEST_RESULT = 2044;          // 퀘스트 요청 거부 결과 (본인에게만, 거부일 때만)
    SC_MAIL_NOTICE = 2045;           // 수령함에 받을 것이 있음 (본인): 경매 판매·만료 때, 로그인 때 수령함이 비어 있지 않으면
}

// 던전 인스턴스 상태 (SC_DUNGEON_STATE_PACKET.state — DG3c)
enum DungeonState {
    DUNGEON_STATE_NONE = 0;
    DUNGEON_STATE_IN_PROGRESS = 1;   // 진행 중
    DUNGEON_STATE_CLEARED = 2;       // 우두머리를 잡음 — remain_sec 뒤 마을로 내보냄
}

// 포털 종류 (PortalInfo.kind — 클라이언트 안내 문구 구분, DG3c D-225)
enum PortalKind {
    PORTAL_KIND_NORMAL = 0;          // 같은 레벨 안의 이동(문 포털 등)
    PORTAL_KIND_DUNGEON_ENTER = 1;   // 던전 입구
    PORTAL_KIND_DUNGEON_EXIT = 2;    // 던전 출구
}

// Room 종류 (SC_ROOM_CHANGE_PACKET.kind — DG3b, D-215)
enum RoomKind {
    ROOM_KIND_NONE = 0;
    ROOM_KIND_TOWN = 1;      // 마을
    ROOM_KIND_FIELD = 2;     // 사냥터
    ROOM_KIND_DUNGEON = 3;   // 던전 인스턴스 (DG3c)
}

// SC_MOVE_RESULT_PACKET.result. 죽음·시전 중·재사용 대기·거리 같은 포털 거부는 지금처럼 응답 없이 버리고, 아래 사유만 알린다.
enum MoveResult {
    MOVE_RESULT_NONE = 0;
    MOVE_RESULT_DUNGEON_FULL = 1;      // 인스턴스 수 상한 (DG3c)
    MOVE_RESULT_NOT_LEADER = 2;        // 파티장만 새 인스턴스를 만들 수 있음 (DG3c)
    MOVE_RESULT_DUNGEON_CLEARED = 3;   // 클리어한 인스턴스 (DG3c)
    MOVE_RESULT_TIMEOUT = 4;           // 끝나지 않은 일(DB 작업)을 기다리다 시간 초과 — 다시 시도
    MOVE_RESULT_NOT_AVAILABLE = 5;     // 갈 수 없는 포털
}

// SC_PARTY_RESULT_PACKET.result (DG2 — DESIGN_PARTY_DUNGEON.md §5-3)
enum PartyResult {
    PARTY_RESULT_NONE = 0;
    PARTY_RESULT_NO_TARGET = 1;        // 대상이 없음(접속하지 않음·자기 자신)
    PARTY_RESULT_OTHER_CHANNEL = 2;    // 다른 채널
    PARTY_RESULT_TARGET_IN_PARTY = 3;  // 대상이 이미 파티 중
    PARTY_RESULT_TARGET_BUSY = 4;      // 대상에게 다른 초대가 와 있음
    PARTY_RESULT_PARTY_FULL = 5;       // 정원(EconomyTable.PartyMaxMembers)
    PARTY_RESULT_NOT_LEADER = 6;       // 파티장만 초대할 수 있음
    PARTY_RESULT_IN_DUNGEON = 7;       // 던전 인스턴스 안 (DG3c)
    PARTY_RESULT_DECLINED = 8;         // 상대가 거절 (초대한 쪽에게)
    PARTY_RESULT_TIMEOUT = 9;          // 응답 시간 초과 (양쪽에게)
    PARTY_RESULT_NO_INVITE = 10;       // 답할 초대가 없음
    PARTY_RESULT_NOT_IN_PARTY = 11;    // 파티가 없는데 탈퇴
    PARTY_RESULT_TOO_FREQUENT = 12;    // 초대 간격(1초) 미만
}

enum MoveState {
    MOVE_STATE_NONE = 0;
    MOVE_STATE_IDLE = 1;
    MOVE_STATE_RUN = 2;
    MOVE_STATE_JUMP = 3;
    MOVE_STATE_ATTACK = 4;
}

enum ObjectType {
    OBJECT_TYPE_NONE = 0;
    OBJECT_TYPE_PLAYER = 1;
    OBJECT_TYPE_MONSTER = 2;
    OBJECT_TYPE_NPC = 3;
    OBJECT_TYPE_ITEM = 4;
    OBJECT_TYPE_ENVIRONMENT = 5;
}

// 플레이어 체형(가입 때 고정). 몬스터는 ObjectType으로 구분하고 종류는 ObjectInfo.template_id(MonsterTable ID)로 보낸다.
// 3(옛 MONSTER), 4(옛 WARRIOR), 5(옛 ARCHER)는 재사용하지 않는다 (2026-11-07 MC3.1b). DB에 남은 4·5 행은 MC3.3에서 마이그레이션한다.
enum PlayerType {
    reserved 3, 4, 5;
    PLAYER_TYPE_NONE = 0;
    PLAYER_TYPE_MALE = 1;
    PLAYER_TYPE_FEMALE = 2;
}

// 장비 슬롯. 번호 = ItemTable itemId 첫째 자리 (MC3.2 재번호, 옛 UPPER 1/LOWER 2/OUTFIT_SHOES 3/WEAPON 5 대체)
// OFFHAND = 보조손(방패, MC4.2f). 한손검(WeaponType Sword)일 때만 착용, 다른 무기로 바꾸면 서버가 비운다.
enum EquipPart {
    EQUIP_PART_NONE = 0;
    EQUIP_PART_HEAD = 1;
    EQUIP_PART_TOP = 2;
    EQUIP_PART_BOTTOM = 3;
    EQUIP_PART_GLOVES = 4;
    EQUIP_PART_BOOTS = 5;
    EQUIP_PART_WEAPON = 6;
    EQUIP_PART_OFFHAND = 7;
}

// SC_CHANGE_EQUIP_RESULT_PACKET.result. 성공은 SC_CHANGE_EQUIP 방송으로 알리므로 이 패킷은 거부일 때만 보낸다.
enum EquipResult {
    EQUIP_RESULT_NONE = 0;
    EQUIP_RESULT_SUCCESS = 1;
    EQUIP_RESULT_NO_ITEM = 2;       // ItemTable에 없는 아이템
    EQUIP_RESULT_WRONG_SLOT = 3;    // 슬롯이 없거나 아이템 슬롯과 다름
    EQUIP_RESULT_ACTING = 4;        // 시전 중(행동 잠금 중)
    EQUIP_RESULT_DEAD = 5;          // 사망 중
    EQUIP_RESULT_TOO_FREQUENT = 6;  // 교체 빈도 제한(MovementTable.EquipMinIntervalMs)
    EQUIP_RESULT_NOT_IN_ROOM = 7;   // 방에 들어가기 전
    EQUIP_RESULT_NEED_SWORD = 8;    // 보조손(방패)은 한손검을 든 상태에서만 착용
    EQUIP_RESULT_NOT_OWNED = 9;       // 내 인벤토리 위치의 아이템이 아님 (A3.3, D-156)
    EQUIP_RESULT_LEVEL_TOO_LOW = 10;  // ItemTable.RequiredLevel 미달
    EQUIP_RESULT_INVENTORY_FULL = 11; // 해제·방패 자동 해제로 내려올 칸이 없음
    EQUIP_RESULT_BUSY = 12;           // 이 플레이어의 다른 아이템 작업이 진행 중 (다시 시도)
    EQUIP_RESULT_IN_TRADE = 13;       // 거래에 올린 아이템 (A4)
    EQUIP_RESULT_DB_ERROR = 14;       // DB 실패 — 바뀐 것 없음
    EQUIP_RESULT_NOT_ALLOWED = 15;    // 더미 봇 (D-161)
}

// SC_ATTACK_RESULT_PACKET.result. 성공은 SC_ATTACK 방송으로 알리므로 이 패킷은 거부일 때만 보낸다. (CP1, D-211)
// 클라이언트는 내 시전을 입력 즉시 시작하고, 이 패킷의 seq가 그 시전과 같으면 되돌린다.
enum AttackResult {
    ATTACK_RESULT_NONE = 0;
    ATTACK_RESULT_DEAD = 1;          // 사망 중
    ATTACK_RESULT_HIT_STUN = 2;      // 피격 경직 중
    ATTACK_RESULT_ACTING = 3;        // 앞 동작(또는 무기 교체 잠금)이 끝나지 않음 — remain_ms = 남은 시간
    ATTACK_RESULT_COOLDOWN = 4;      // 스킬 쿨타임 — remain_ms = 남은 시간
    ATTACK_RESULT_NO_SKILL = 5;      // 지금 무기에 그 칸의 스킬이 없음
    ATTACK_RESULT_SWAP_PENDING = 6;  // 무기 교체가 처리 중
    ATTACK_RESULT_NO_TARGET = 7;     // 대상이 없거나 공격할 수 없는 대상
    ATTACK_RESULT_TARGET_DEAD = 8;
    ATTACK_RESULT_TOO_FAR = 9;       // 대상이 사거리 밖
    ATTACK_RESULT_BAD_REQUEST = 10;  // 값이 올바르지 않음
    ATTACK_RESULT_NOT_ENOUGH_MP = 11; // MP가 스킬의 MpCost보다 적음 (A2.3b, D-254)
}

// SC_ITEM_RESULT_PACKET.result. 성공은 SC_INVENTORY_UPDATE로 알리므로 거부일 때만 보낸다. (DESIGN_ITEMS_TRADE "패킷")
enum ItemResult {
    ITEM_RESULT_NONE = 0;
    ITEM_RESULT_SUCCESS = 1;
    ITEM_RESULT_NOT_IN_ROOM = 2;
    ITEM_RESULT_DEAD = 3;
    ITEM_RESULT_BUSY = 4;            // 이 플레이어의 다른 아이템 작업이 진행 중 (클라는 문구를 띄우지 않음)
    ITEM_RESULT_TOO_FREQUENT = 5;    // EconomyTable.ItemMinIntervalMs (클라는 문구를 띄우지 않음)
    ITEM_RESULT_NOT_ALLOWED = 6;     // 더미 봇, DevCommands 꺼짐
    ITEM_RESULT_NO_ITEM = 7;         // 없는 아이템·수량 오류
    ITEM_RESULT_TOO_FAR = 8;
    ITEM_RESULT_NOT_OWNER = 9;
    ITEM_RESULT_INVENTORY_FULL = 10;
    ITEM_RESULT_GOLD_FULL = 11;
    ITEM_RESULT_IN_TRADE = 12;
    ITEM_RESULT_NOT_USABLE = 13;
    ITEM_RESULT_HP_FULL = 14;
    ITEM_RESULT_COOLDOWN = 15;
    ITEM_RESULT_LEVEL_TOO_LOW = 16;
    ITEM_RESULT_DB_ERROR = 17;       // DB 실패 — 바뀐 것 없음
    ITEM_RESULT_BAD_SLOT = 18;       // 칸 번호가 범위 밖이거나 쓸 수 없는 칸
    ITEM_RESULT_NOT_ENOUGH_GOLD = 19; // 상점 구매: 골드 부족 (L4)
    ITEM_RESULT_NOT_SELLABLE = 20;   // 상점 판매: ItemTable.SellPrice 0 (L4)
}

// SC_TRADE_RESULT_PACKET.result(요청 거부)·SC_TRADE_END_PACKET.result(끝난 이유). (DESIGN_ITEMS_TRADE "1:1 거래")
enum TradeResult {
    TRADE_RESULT_NONE = 0;
    TRADE_RESULT_SUCCESS = 1;          // 거래 성사 (SC_TRADE_END)
    TRADE_RESULT_NO_TARGET = 2;        // 대상이 없음(방에 없음·자기 자신·사망·더미 봇)
    TRADE_RESULT_TOO_FAR = 3;          // 거리(EconomyTable.TradeRangeCm) 밖
    TRADE_RESULT_TARGET_BUSY = 4;      // 대상이 다른 거래 중
    TRADE_RESULT_DECLINED = 5;         // 상대가 거절
    TRADE_RESULT_TIMEOUT = 6;          // 요청 응답 시간·전체 시간 초과
    TRADE_RESULT_CANCELLED = 7;        // 한쪽이 취소
    TRADE_RESULT_DEAD = 8;             // 사망
    TRADE_RESULT_DISCONNECTED = 9;     // 접속 해제·방 퇴장
    TRADE_RESULT_LOCKED = 10;          // 잠근 상태에서 제시 변경
    TRADE_RESULT_INVALID_OFFER = 11;   // 제시가 맞지 않음(없는 행·장착 중·수량·중복·개수 초과·골드 부족)
    TRADE_RESULT_INVENTORY_FULL = 12;  // 받는 쪽 빈 칸 부족
    TRADE_RESULT_GOLD_FULL = 13;       // 받는 쪽 골드 상한 초과
    TRADE_RESULT_BUSY = 14;            // 이미 거래 중이거나 아이템 작업이 진행 중(다시 시도)
    TRADE_RESULT_NOT_ALLOWED = 15;     // 더미 봇, 지금 단계에서 받을 수 없는 요청
    TRADE_RESULT_DB_ERROR = 16;        // DB 실패 — 바뀐 것 없음
    TRADE_RESULT_MOVED = 17;           // 한쪽이 다른 Room으로 이동함 (SC_TRADE_END — DG3b)
}

// SC_AUCTION_RESULT_PACKET.result (A4.3 — DESIGN_ITEMS_TRADE "경매장"). 성공도 이 패킷으로 알린다(아이템·골드는 SC_INVENTORY_UPDATE로 따로).
enum AuctionResult {
    AUCTION_RESULT_NONE = 0;
    AUCTION_RESULT_SUCCESS = 1;
    AUCTION_RESULT_NOT_IN_ROOM = 2;
    AUCTION_RESULT_DEAD = 3;
    AUCTION_RESULT_BUSY = 4;             // 이 플레이어의 다른 아이템 작업이 진행 중·Room 이동 중 (클라는 문구를 띄우지 않음)
    AUCTION_RESULT_TOO_FREQUENT = 5;     // 요청 간격 (클라는 문구를 띄우지 않음)
    AUCTION_RESULT_NOT_ALLOWED = 6;      // 더미 봇(검색은 허용), 범위 밖 값
    AUCTION_RESULT_NO_LISTING = 7;       // 없는 등록·이미 끝난 등록·내 것이 아닌 등록(취소)
    AUCTION_RESULT_SOLD = 8;             // 다른 요청이 먼저 처리 중이거나 이미 팔림
    AUCTION_RESULT_OWN_ITEM = 9;         // 내가 올린 물품은 살 수 없음
    AUCTION_RESULT_NOT_ENOUGH_GOLD = 10;
    AUCTION_RESULT_LISTING_LIMIT = 11;   // EconomyTable.AuctionMaxListings
    AUCTION_RESULT_BAD_PRICE = 12;       // EconomyTable.AuctionMinPrice ~ AuctionMaxPrice 밖
    AUCTION_RESULT_NO_ITEM = 13;         // 인벤토리 위치의 내 아이템이 아님(장착 중 포함)·수량 오류
    AUCTION_RESULT_IN_TRADE = 14;        // 1:1 거래에 올린 아이템
    AUCTION_RESULT_INVENTORY_FULL = 15;  // 수령: 빈 칸 없음
    AUCTION_RESULT_GOLD_FULL = 16;       // 수령: 골드 상한 초과
    AUCTION_RESULT_DB_ERROR = 17;        // DB 실패 — 바뀐 것 없음
    AUCTION_RESULT_TOO_FAR = 18;         // 등록·취소·수령: 경매 NPC가 없거나 이용 거리(EconomyTable.ShopRangeCm) 밖 (D-234)
    AUCTION_RESULT_IN_DUNGEON = 19;      // 던전 안에서는 경매를 쓸 수 없음 (D-234)
    AUCTION_RESULT_TRY_LATER = 20;       // 경매 요청이 몰려 있음 — 잠시 뒤에 다시 (ServerConfig AuctionDbMaxInFlight, D-235)
    AUCTION_RESULT_NO_MAIL = 21;         // 수령: 없는 우편
}

// 퀘스트 상태 (QuestInfo.state). DB Player_Quest.State와 같은 값이고, 행이 없으면 NONE이다 (Q1)
enum QuestState {
    QUEST_STATE_NONE = 0;        // 받지 않음
    QUEST_STATE_ACTIVE = 1;      // 진행 중
    QUEST_STATE_COMPLETED = 2;   // 완료(보상 받음) — 다시 받을 수 없다
}

// SC_QUEST_RESULT_PACKET.result. 성공은 SC_QUEST_UPDATE(·SC_INVENTORY_UPDATE)로 알리므로 거부일 때만 보낸다. 2~6·8·15~17은 ItemResult의 같은 이름과 뜻이 같다 (Q1)
enum QuestResult {
    QUEST_RESULT_NONE = 0;
    QUEST_RESULT_SUCCESS = 1;
    QUEST_RESULT_NOT_IN_ROOM = 2;
    QUEST_RESULT_DEAD = 3;
    QUEST_RESULT_BUSY = 4;             // 이 플레이어의 다른 아이템 작업이 진행 중·Room 이동 중 (클라는 문구를 띄우지 않음)
    QUEST_RESULT_TOO_FREQUENT = 5;     // EconomyTable.ItemMinIntervalMs (클라는 문구를 띄우지 않음)
    QUEST_RESULT_NOT_ALLOWED = 6;      // 더미 봇
    QUEST_RESULT_NO_QUEST = 7;         // 없는 퀘스트·없는 NPC·그 NPC의 퀘스트가 아님
    QUEST_RESULT_TOO_FAR = 8;          // 퀘스트 NPC 이용 거리(EconomyTable.ShopRangeCm) 밖
    QUEST_RESULT_IN_TRADE = 9;         // 1:1 거래 중
    QUEST_RESULT_ALREADY_ACTIVE = 10;  // 사용 안 함(D-264 — 요청 하나로 합친 뒤 진행 중이면 완료 시도가 됨)
    QUEST_RESULT_ALREADY_DONE = 11;    // 이미 완료한 퀘스트(한 번만 할 수 있음)
    QUEST_RESULT_NOT_ACTIVE = 12;      // 사용 안 함(D-264 — 받지 않은 퀘스트를 요청하면 수락이 됨)
    QUEST_RESULT_NOT_FINISHED = 13;    // 완료: 처치 수가 모자람
    QUEST_RESULT_NOT_ENOUGH_ITEM = 14; // 완료: 제출할 아이템이 모자람(인벤토리 위치만 센다)
    QUEST_RESULT_INVENTORY_FULL = 15;  // 완료: 보상 아이템이 들어갈 칸이 없음
    QUEST_RESULT_GOLD_FULL = 16;       // 완료: 보상 골드를 받으면 상한 초과
    QUEST_RESULT_DB_ERROR = 17;        // DB 실패 — 바뀐 것 없음
}

// 수령함 한 건의 종류 (MailInfo.kind = DB Player_Mail.Kind). SC_MAIL_NOTICE_PACKET.kind에도 쓴다(NONE·SALE_GOLD·EXPIRED)
enum MailKind {
    MAIL_KIND_NONE = 0;
    MAIL_KIND_SALE_GOLD = 1;     // 판매 대금 (골드)
    MAIL_KIND_BOUGHT_ITEM = 2;   // 구매품 (아이템)
    MAIL_KIND_EXPIRED = 3;       // 만료 반환 (아이템)
    MAIL_KIND_CANCELLED = 4;     // 취소 반환 (아이템)
}

// NPC가 하는 일 (ObjectInfo.npc_kind — 클라이언트의 F 키 안내 구분, D-234). 한 NPC는 하나만 한다
enum NpcKind {
    NPC_KIND_NONE = 0;
    NPC_KIND_SHOP = 1;       // 상점 (L4)
    NPC_KIND_AUCTION = 2;    // 경매 관리인 — 등록·취소·수령은 이 NPC 근처에서만 (A4.3)
    NPC_KIND_QUEST = 3;      // 퀘스트 NPC — QuestTable.NpcId가 가리키는 NPC. 수락·완료는 이 NPC 근처에서만 (Q1)
}

// SC_TRADE_STATE_PACKET.phase
enum TradePhase {
    TRADE_PHASE_NONE = 0;
    TRADE_PHASE_REQUESTING = 1;   // 요청을 보내고 응답을 기다리는 중
    TRADE_PHASE_OFFERING = 2;     // 제시·잠금·확정을 주고받는 중 (잠금·확정 여부는 TradeOffer에)
    TRADE_PHASE_CONFIRMING = 3;   // 양쪽 확정 — DB 결과를 기다리는 중(모든 요청 거부)
}

// SC_LOGIN_INFO_PACKET.result. 성공일 때만 object_info가 채워진다.
enum LoginResult {
    LOGIN_RESULT_NONE = 0;
    LOGIN_RESULT_SUCCESS = 1;
    LOGIN_RESULT_NO_ACCOUNT = 2;       // 없는 ID
    LOGIN_RESULT_WRONG_PASSWORD = 3;
    LOGIN_RESULT_ALREADY_LOGGED_IN = 4; // 같은 연결에서 이미 로그인함
    LOGIN_RESULT_SERVER_ERROR = 5;      // DB 오류 등
    LOGIN_RESULT_BUSY = 6;              // 같은 캐릭터의 이전 접속 정리를 기다리다 시간 초과, 또는 더 늦은 로그인에 밀림 (A2.7) — 잠시 후 다시 시도
}

// SC_KICK_PACKET.reason
enum KickReason {
    KICK_REASON_NONE = 0;
    KICK_REASON_DUPLICATE_LOGIN = 1;    // 같은 캐릭터로 다른 연결이 로그인함 (A2.7, D-158)
}