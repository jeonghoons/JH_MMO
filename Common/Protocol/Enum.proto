syntax = "proto3";
package Protocol;

enum PacketId {
    PKT_NONE = 0;
    // 삭제한 패킷 번호는 재사용하지 않는다 (2026-10-28 정리: LOGOUT, CMOVE, LEAVE_ROOM)
    reserved 1002, 1005, 1007, 2002, 2007;
    
    // Client -> Server
    CS_LOGIN = 1000;
    CS_SIGNUP = 1001;
    CS_CHAT = 1003;
    CS_MOVE = 1004;
    CS_ENTER_ROOM = 1006;
    CS_ATTACK = 1008;
    CS_CHANGE_EQUIP = 1009;
    CS_PING = 1010;       // 부하 테스트/지연 측정용
    CS_SKILL_AIM = 1011;  // 스킬 조준 켜기/끄기 (상태가 바뀔 때만)
    
    // Server -> Client
    SC_LOGIN = 2000;
    SC_SIGNUP = 2001;
    SC_ADD_OBJECT = 2003;
    SC_REMOVE_OBJECT = 2004;
    SC_CHAT = 2005;
    SC_MOVE_OBJECT = 2006;
    SC_ATTACK = 2008;
    SC_DAMAGE = 2009;
    SC_DEAD = 2010;
    SC_CHANGE_EQUIP = 2011;
    SC_PONG = 2012;
    SC_CHANGE_EQUIP_RESULT = 2013;   // 장착 거부 결과 (본인에게만)
    SC_SKILL_AIM = 2014;             // 스킬 조준 상태 (AOI 방송, 거부·시간 초과는 본인에게 seq 포함)
}

enum MoveState {
    MOVE_STATE_NONE = 0;
    MOVE_STATE_IDLE = 1;
    MOVE_STATE_RUN = 2;
    MOVE_STATE_JUMP = 3;
    MOVE_STATE_ATTACK = 4;
}

enum ObjectType {
    OBJECT_TYPE_NONE = 0;
    OBJECT_TYPE_PLAYER = 1;
    OBJECT_TYPE_MONSTER = 2;
    OBJECT_TYPE_NPC = 3;
    OBJECT_TYPE_ITEM = 4;
    OBJECT_TYPE_ENVIRONMENT = 5;
}

// 플레이어 체형(가입 때 고정). 몬스터는 ObjectType으로 구분하고 종류는 ObjectInfo.template_id(MonsterTable ID)로 보낸다.
// 3(옛 MONSTER), 4(옛 WARRIOR), 5(옛 ARCHER)는 재사용하지 않는다 (2026-11-07 MC3.1b). DB에 남은 4·5 행은 MC3.3에서 마이그레이션한다.
enum PlayerType {
    reserved 3, 4, 5;
    PLAYER_TYPE_NONE = 0;
    PLAYER_TYPE_MALE = 1;
    PLAYER_TYPE_FEMALE = 2;
}

// 장비 슬롯. 번호 = ItemTable itemId 첫째 자리 (MC3.2 재번호, 옛 UPPER 1/LOWER 2/OUTFIT_SHOES 3/WEAPON 5 대체)
// OFFHAND = 보조손(방패, MC4.2f). 한손검(WeaponType Sword)일 때만 착용, 다른 무기로 바꾸면 서버가 비운다.
enum EquipPart {
    EQUIP_PART_NONE = 0;
    EQUIP_PART_HEAD = 1;
    EQUIP_PART_TOP = 2;
    EQUIP_PART_BOTTOM = 3;
    EQUIP_PART_GLOVES = 4;
    EQUIP_PART_BOOTS = 5;
    EQUIP_PART_WEAPON = 6;
    EQUIP_PART_OFFHAND = 7;
}

// SC_CHANGE_EQUIP_RESULT_PACKET.result. 성공은 SC_CHANGE_EQUIP 방송으로 알리므로 이 패킷은 거부일 때만 보낸다.
enum EquipResult {
    EQUIP_RESULT_NONE = 0;
    EQUIP_RESULT_SUCCESS = 1;
    EQUIP_RESULT_NO_ITEM = 2;       // ItemTable에 없는 아이템
    EQUIP_RESULT_WRONG_SLOT = 3;    // 슬롯이 없거나 아이템 슬롯과 다름
    EQUIP_RESULT_ACTING = 4;        // 시전 중(행동 잠금 중)
    EQUIP_RESULT_DEAD = 5;          // 사망 중
    EQUIP_RESULT_TOO_FREQUENT = 6;  // 교체 빈도 제한(MovementTable.EquipMinIntervalMs)
    EQUIP_RESULT_NOT_IN_ROOM = 7;   // 방에 들어가기 전
    EQUIP_RESULT_NEED_SWORD = 8;    // 보조손(방패)은 한손검을 든 상태에서만 착용
}

// SC_LOGIN_INFO_PACKET.result. 성공일 때만 object_info가 채워진다.
enum LoginResult {
    LOGIN_RESULT_NONE = 0;
    LOGIN_RESULT_SUCCESS = 1;
    LOGIN_RESULT_NO_ACCOUNT = 2;       // 없는 ID
    LOGIN_RESULT_WRONG_PASSWORD = 3;
    LOGIN_RESULT_ALREADY_LOGGED_IN = 4; // 같은 연결에서 이미 로그인함
    LOGIN_RESULT_SERVER_ERROR = 5;      // DB 오류 등
}