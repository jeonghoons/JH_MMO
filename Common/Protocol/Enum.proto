syntax = "proto3";
package Protocol;

enum PacketId {
    PKT_NONE = 0;
    // 삭제한 패킷 번호는 재사용하지 않는다 (2026-10-28 정리: LOGOUT, CMOVE, LEAVE_ROOM)
    reserved 1002, 1005, 1007, 2002, 2007;
    
    // Client -> Server
    CS_LOGIN = 1000;
    CS_SIGNUP = 1001;
    CS_CHAT = 1003;
    CS_MOVE = 1004;
    CS_ENTER_ROOM = 1006;
    CS_ATTACK = 1008;
    CS_CHANGE_EQUIP = 1009;
    CS_PING = 1010;       // 부하 테스트/지연 측정용
    CS_SKILL_AIM = 1011;  // 스킬 조준 켜기/끄기 (상태가 바뀔 때만)
    CS_REVIVE = 1012;     // 부활 요청 (사망 후 대기 시간이 지나야 서버가 받는다)
    CS_PICKUP_ITEM = 1013; // 바닥 드랍 줍기 (A3.5)
    CS_DROP_ITEM = 1014;   // 인벤토리 아이템을 바닥에 버리기 (A3.5, D-155)
    CS_USE_ITEM = 1015;    // 소비 아이템 사용 (A3.6, D-154)
    CS_SET_QUICKSLOT = 1016; // 액티브 칸에 아이템 종류 올리기·비우기 (A3.6)
    CS_DEV_GIVE = 1017;   // 개발 지급 명령 (ServerConfig [Debug] DevCommands=true일 때만)
    // 1:1 거래 (A4.2, D-158). 같은 방의 두 플레이어, 모든 전이는 서버가 판정한다
    CS_TRADE_REQUEST = 1018;   // 거래 요청 (대상 오브젝트 id)
    CS_TRADE_RESPOND = 1019;   // 받은 요청에 수락·거절
    CS_TRADE_SET_OFFER = 1020; // 내 제시 전체를 교체 (아이템 목록 + 골드)
    CS_TRADE_LOCK = 1021;      // 내 제시 잠금·풀기
    CS_TRADE_CONFIRM = 1022;   // 확정 (양쪽 잠금 뒤에만)
    CS_TRADE_CANCEL = 1023;    // 취소 (요청 중·제시·잠금 어느 때나)
    CS_MOVE_ITEM = 1030;  // 인벤토리 칸 옮기기·맞바꾸기 (A6.1). 1024~1029는 A4.3 예약
    CS_SHOP_OPEN = 1031;  // 상점 NPC 품목 요청 (L4, D-202)
    CS_SHOP_BUY = 1032;   // 상점 구매
    CS_SHOP_SELL = 1033;  // 상점 판매

    // Server -> Client
    SC_LOGIN = 2000;
    SC_SIGNUP = 2001;
    SC_ADD_OBJECT = 2003;
    SC_REMOVE_OBJECT = 2004;
    SC_CHAT = 2005;
    SC_MOVE_OBJECT = 2006;
    SC_ATTACK = 2008;
    SC_DAMAGE = 2009;
    SC_DEAD = 2010;
    SC_CHANGE_EQUIP = 2011;
    SC_PONG = 2012;
    SC_CHANGE_EQUIP_RESULT = 2013;   // 장착 거부 결과 (본인에게만)
    SC_SKILL_AIM = 2014;             // 스킬 조준 상태 (AOI 방송, 거부·시간 초과는 본인에게 seq 포함)
    SC_REVIVE = 2015;                // 플레이어 부활 (AOI 방송, 본인 포함)
    SC_INVENTORY = 2016;             // 방 입장 직후 본인에게: 인벤토리·장착 전체 + 골드 + 칸 수 (A3.3)
    SC_INVENTORY_UPDATE = 2017;      // 본인에게: 바뀐 행·지워진 행·현재 골드 (A3.3)
    SC_ITEM_RESULT = 2018;           // 아이템 요청 거부 결과 (본인에게만, 거부일 때만)
    SC_USE_ITEM = 2019;              // 소비 아이템 사용 결과 (AOI, 본인 포함): 쓴 종류·사용 뒤 HP·재사용 시간 (A3.6)
    SC_TRADE_REQUEST = 2020;         // 거래 요청을 받은 쪽에게 (A4.2)
    SC_TRADE_STATE = 2021;           // 거래 상태 전체: 단계, 양쪽 제시·잠금·확정 (두 사람에게, 바뀔 때마다)
    SC_TRADE_END = 2022;             // 거래가 끝났다: 성사 또는 취소 사유 (두 사람에게)
    SC_TRADE_RESULT = 2023;          // 거래 요청 거부 결과 (본인에게, 거부일 때만. 확정 재검증 실패는 두 사람에게)
    SC_KICK = 2027;                  // 서버가 연결을 끊기 직전 본인에게 (사유). 2024~2026은 A4.3 예약(DESIGN_ITEMS_TRADE)
    SC_CHANGE_HP = 2028;             // 피해·아이템 사용이 아닌 HP 변화 (AOI): 몬스터가 홈으로 돌아가 회복 (L3, D-193)
    SC_SHOP_OPEN = 2029;             // 상점 품목·구매가 (본인, L4)
}

enum MoveState {
    MOVE_STATE_NONE = 0;
    MOVE_STATE_IDLE = 1;
    MOVE_STATE_RUN = 2;
    MOVE_STATE_JUMP = 3;
    MOVE_STATE_ATTACK = 4;
}

enum ObjectType {
    OBJECT_TYPE_NONE = 0;
    OBJECT_TYPE_PLAYER = 1;
    OBJECT_TYPE_MONSTER = 2;
    OBJECT_TYPE_NPC = 3;
    OBJECT_TYPE_ITEM = 4;
    OBJECT_TYPE_ENVIRONMENT = 5;
}

// 플레이어 체형(가입 때 고정). 몬스터는 ObjectType으로 구분하고 종류는 ObjectInfo.template_id(MonsterTable ID)로 보낸다.
// 3(옛 MONSTER), 4(옛 WARRIOR), 5(옛 ARCHER)는 재사용하지 않는다 (2026-11-07 MC3.1b). DB에 남은 4·5 행은 MC3.3에서 마이그레이션한다.
enum PlayerType {
    reserved 3, 4, 5;
    PLAYER_TYPE_NONE = 0;
    PLAYER_TYPE_MALE = 1;
    PLAYER_TYPE_FEMALE = 2;
}

// 장비 슬롯. 번호 = ItemTable itemId 첫째 자리 (MC3.2 재번호, 옛 UPPER 1/LOWER 2/OUTFIT_SHOES 3/WEAPON 5 대체)
// OFFHAND = 보조손(방패, MC4.2f). 한손검(WeaponType Sword)일 때만 착용, 다른 무기로 바꾸면 서버가 비운다.
enum EquipPart {
    EQUIP_PART_NONE = 0;
    EQUIP_PART_HEAD = 1;
    EQUIP_PART_TOP = 2;
    EQUIP_PART_BOTTOM = 3;
    EQUIP_PART_GLOVES = 4;
    EQUIP_PART_BOOTS = 5;
    EQUIP_PART_WEAPON = 6;
    EQUIP_PART_OFFHAND = 7;
}

// SC_CHANGE_EQUIP_RESULT_PACKET.result. 성공은 SC_CHANGE_EQUIP 방송으로 알리므로 이 패킷은 거부일 때만 보낸다.
enum EquipResult {
    EQUIP_RESULT_NONE = 0;
    EQUIP_RESULT_SUCCESS = 1;
    EQUIP_RESULT_NO_ITEM = 2;       // ItemTable에 없는 아이템
    EQUIP_RESULT_WRONG_SLOT = 3;    // 슬롯이 없거나 아이템 슬롯과 다름
    EQUIP_RESULT_ACTING = 4;        // 시전 중(행동 잠금 중)
    EQUIP_RESULT_DEAD = 5;          // 사망 중
    EQUIP_RESULT_TOO_FREQUENT = 6;  // 교체 빈도 제한(MovementTable.EquipMinIntervalMs)
    EQUIP_RESULT_NOT_IN_ROOM = 7;   // 방에 들어가기 전
    EQUIP_RESULT_NEED_SWORD = 8;    // 보조손(방패)은 한손검을 든 상태에서만 착용
    EQUIP_RESULT_NOT_OWNED = 9;       // 내 인벤토리 위치의 아이템이 아님 (A3.3, D-156)
    EQUIP_RESULT_LEVEL_TOO_LOW = 10;  // ItemTable.RequiredLevel 미달
    EQUIP_RESULT_INVENTORY_FULL = 11; // 해제·방패 자동 해제로 내려올 칸이 없음
    EQUIP_RESULT_BUSY = 12;           // 이 플레이어의 다른 아이템 작업이 진행 중 (다시 시도)
    EQUIP_RESULT_IN_TRADE = 13;       // 거래에 올린 아이템 (A4)
    EQUIP_RESULT_DB_ERROR = 14;       // DB 실패 — 바뀐 것 없음
    EQUIP_RESULT_NOT_ALLOWED = 15;    // 더미 봇 (D-161)
}

// SC_ITEM_RESULT_PACKET.result. 성공은 SC_INVENTORY_UPDATE로 알리므로 거부일 때만 보낸다. (DESIGN_ITEMS_TRADE "패킷")
enum ItemResult {
    ITEM_RESULT_NONE = 0;
    ITEM_RESULT_SUCCESS = 1;
    ITEM_RESULT_NOT_IN_ROOM = 2;
    ITEM_RESULT_DEAD = 3;
    ITEM_RESULT_BUSY = 4;            // 이 플레이어의 다른 아이템 작업이 진행 중 (클라는 문구를 띄우지 않음)
    ITEM_RESULT_TOO_FREQUENT = 5;    // EconomyTable.ItemMinIntervalMs (클라는 문구를 띄우지 않음)
    ITEM_RESULT_NOT_ALLOWED = 6;     // 더미 봇, DevCommands 꺼짐
    ITEM_RESULT_NO_ITEM = 7;         // 없는 아이템·수량 오류
    ITEM_RESULT_TOO_FAR = 8;
    ITEM_RESULT_NOT_OWNER = 9;
    ITEM_RESULT_INVENTORY_FULL = 10;
    ITEM_RESULT_GOLD_FULL = 11;
    ITEM_RESULT_IN_TRADE = 12;
    ITEM_RESULT_NOT_USABLE = 13;
    ITEM_RESULT_HP_FULL = 14;
    ITEM_RESULT_COOLDOWN = 15;
    ITEM_RESULT_LEVEL_TOO_LOW = 16;
    ITEM_RESULT_DB_ERROR = 17;       // DB 실패 — 바뀐 것 없음
    ITEM_RESULT_BAD_SLOT = 18;       // 칸 번호가 범위 밖이거나 쓸 수 없는 칸
    ITEM_RESULT_NOT_ENOUGH_GOLD = 19; // 상점 구매: 골드 부족 (L4)
    ITEM_RESULT_NOT_SELLABLE = 20;   // 상점 판매: ItemTable.SellPrice 0 (L4)
}

// SC_TRADE_RESULT_PACKET.result(요청 거부)·SC_TRADE_END_PACKET.result(끝난 이유). (DESIGN_ITEMS_TRADE "1:1 거래")
enum TradeResult {
    TRADE_RESULT_NONE = 0;
    TRADE_RESULT_SUCCESS = 1;          // 거래 성사 (SC_TRADE_END)
    TRADE_RESULT_NO_TARGET = 2;        // 대상이 없음(방에 없음·자기 자신·사망·더미 봇)
    TRADE_RESULT_TOO_FAR = 3;          // 거리(EconomyTable.TradeRangeCm) 밖
    TRADE_RESULT_TARGET_BUSY = 4;      // 대상이 다른 거래 중
    TRADE_RESULT_DECLINED = 5;         // 상대가 거절
    TRADE_RESULT_TIMEOUT = 6;          // 요청 응답 시간·전체 시간 초과
    TRADE_RESULT_CANCELLED = 7;        // 한쪽이 취소
    TRADE_RESULT_DEAD = 8;             // 사망
    TRADE_RESULT_DISCONNECTED = 9;     // 접속 해제·방 퇴장
    TRADE_RESULT_LOCKED = 10;          // 잠근 상태에서 제시 변경
    TRADE_RESULT_INVALID_OFFER = 11;   // 제시가 맞지 않음(없는 행·장착 중·수량·중복·개수 초과·골드 부족)
    TRADE_RESULT_INVENTORY_FULL = 12;  // 받는 쪽 빈 칸 부족
    TRADE_RESULT_GOLD_FULL = 13;       // 받는 쪽 골드 상한 초과
    TRADE_RESULT_BUSY = 14;            // 이미 거래 중이거나 아이템 작업이 진행 중(다시 시도)
    TRADE_RESULT_NOT_ALLOWED = 15;     // 더미 봇, 지금 단계에서 받을 수 없는 요청
    TRADE_RESULT_DB_ERROR = 16;        // DB 실패 — 바뀐 것 없음
}

// SC_TRADE_STATE_PACKET.phase
enum TradePhase {
    TRADE_PHASE_NONE = 0;
    TRADE_PHASE_REQUESTING = 1;   // 요청을 보내고 응답을 기다리는 중
    TRADE_PHASE_OFFERING = 2;     // 제시·잠금·확정을 주고받는 중 (잠금·확정 여부는 TradeOffer에)
    TRADE_PHASE_CONFIRMING = 3;   // 양쪽 확정 — DB 결과를 기다리는 중(모든 요청 거부)
}

// SC_LOGIN_INFO_PACKET.result. 성공일 때만 object_info가 채워진다.
enum LoginResult {
    LOGIN_RESULT_NONE = 0;
    LOGIN_RESULT_SUCCESS = 1;
    LOGIN_RESULT_NO_ACCOUNT = 2;       // 없는 ID
    LOGIN_RESULT_WRONG_PASSWORD = 3;
    LOGIN_RESULT_ALREADY_LOGGED_IN = 4; // 같은 연결에서 이미 로그인함
    LOGIN_RESULT_SERVER_ERROR = 5;      // DB 오류 등
    LOGIN_RESULT_BUSY = 6;              // 같은 캐릭터의 이전 접속 정리를 기다리다 시간 초과, 또는 더 늦은 로그인에 밀림 (A2.7) — 잠시 후 다시 시도
}

// SC_KICK_PACKET.reason
enum KickReason {
    KICK_REASON_NONE = 0;
    KICK_REASON_DUPLICATE_LOGIN = 1;    // 같은 캐릭터로 다른 연결이 로그인함 (A2.7, D-158)
}