syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";


// ==========================================
//  Client -> Server
// ==========================================
message CS_LOGIN_PACKET {
	string account_id = 1;
	string account_pw = 2;
	bool is_dummy = 3;
}

message CS_SIGNUP_PACKET {
	string account_id = 1;
	string account_pw = 2;
	PlayerType player_type = 3;
}

message CS_CHAT_PACKET {
	string message = 1;
}

message CS_ENTER_ROOM_PACKET {
	bool result = 1;
}

message CS_MOVE_PACKET {
	PositionInfo pos_info = 1;
	bool force = 2;
}

message CS_DMOVE_PACKET {
	float input_x = 1;
	float input_y = 2;
}

message CS_ATTACK_PACKET {
	int32 target_id = 1;      // Targeted 스킬의 대상 (NonTargeted는 0)
	int32 skill_slot = 2;     // 0 = 기본 공격, 1~5 = 스킬 슬롯 (서버가 영웅의 SkillTable로 해석)
	float aim_yaw = 3;       // NonTargeted의 시전 방향(deg)
	float aim_x = 4;         // 지면 지정 스킬의 목표 지점
	float aim_y = 5;
}

message CS_CHANGE_EQUIP_PACKET {
	EquipPart part = 1;
	int32 item_id = 2;
}

// 서버 JobQueue 지연까지 포함한 왕복 시간 측정용. client_time은 서버가 그대로 돌려준다.
message CS_PING_PACKET {
	int64 client_time = 1;
}

// ==========================================
//  Server -> Client
// ==========================================

message SC_LOGIN_INFO_PACKET {
	ObjectInfo object_info = 1;   // result가 SUCCESS일 때만 채워진다
	LoginResult result = 2;
}

message SC_SIGNUP_PACKET {
	bool result = 1;   // false: 중복 ID, 잘못된 영웅, 이미 로그인한 연결 등
}

message SC_ADD_OBJECT_PACKET {
	ObjectInfo object_info = 1;
}

message SC_REMOVE_OBJECT_PACKET {
	int32 object_id = 1;
}

message SC_CHAT_PACKET {
	int32 sender_id = 1;
	string message = 2;
}

message SC_MOVE_PACKET {
	ObjectInfo object_info = 1;
	uint32 move_time = 2; 
}

message SC_ATTACK_PACKET {
	int32 attacker_id = 1;
	int32 skill_id = 2;
	int32 target_id = 3;
	float aim_yaw = 4;       // 서버가 확정한 시전 방향
	float aim_x = 5;         // 서버가 사거리로 보정한 지면 목표 지점
	float aim_y = 6;
	int32 cooldown_ms = 7;   // 서버가 적용한 이 스킬의 쿨타임(기본 공격은 공격 속도 반영). 클라이언트 쿨타임 표시용
}

message SC_DAMAGE_PACKET {
	int32 attacker_id = 1;
	int32 target_id = 2;
	int32 damage = 3;
	int32 remain_hp = 4;
}

message SC_DEAD_PACKET {
	int32 object_id = 1;
}

message SC_CHANGE_EQUIP_PACKET {
	int32 object_id = 1;
	EquipPart part = 2;
	int32 item_id = 3;
}

message SC_PONG_PACKET {
	int64 client_time = 1;
}
