syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";


// ==========================================
//  Client -> Server
// ==========================================
message CS_LOGIN_PACKET {
	string account_id = 1;
	string account_pw = 2;
	bool is_dummy = 3;
}

message CS_SIGNUP_PACKET {
	string account_id = 1;
	string account_pw = 2;
	PlayerType player_type = 3;
}

message CS_CHAT_PACKET {
	string message = 1;
}

message CS_ENTER_ROOM_PACKET {
	bool result = 1;
}

message CS_MOVE_PACKET {
	PositionInfo pos_info = 1;
	bool force = 2;
	uint32 correction_seq = 3; // 마지막으로 받은 내 위치 보정(SC_MOVE)의 순번. 서버는 이보다 오래된 이동을 버린다
}

message CS_ATTACK_PACKET {
	int32 target_id = 1;      // Targeted 스킬의 대상 (NonTargeted는 0)
	int32 skill_slot = 2;     // 0 = 기본 공격, 1~5 = 스킬 슬롯 (서버가 장착 무기 타입의 SkillTable로 해석)
	float aim_yaw = 3;       // NonTargeted의 시전 방향(deg)
	float aim_x = 4;         // 지면 지정 스킬의 목표 지점
	float aim_y = 5;
	uint32 seq = 6;          // 요청 순번(클라이언트가 1부터 증가). SC_ATTACK·SC_ATTACK_RESULT가 그대로 돌려준다 (CP1, D-211). 0 = 순번 없음
}

message CS_CHANGE_EQUIP_PACKET {
	EquipPart part = 1;
	reserved 2;              // item_id (A3.3에서 item_db_id로 대체, D-156)
	int64 item_db_id = 3;    // 내 인벤토리의 아이템(Player_Item.ItemDbId). 0 = 해제
}

// 개발 지급 명령(A3.3). ServerConfig [Debug] DevCommands=true일 때만 받는다. 다른 아이템 작업과 같은 경로(DB 성공 뒤 반영)를 탄다.
message CS_DEV_GIVE_PACKET {
	int32 item_id = 1;   // ItemTable ID. 0 = 골드
	int64 count = 2;     // 수량(골드는 금액). 1 이상
}

// 바닥 드랍 줍기(A3.5). 성공은 SC_REMOVE_OBJECT(보던 사람 전원) + SC_INVENTORY_UPDATE(본인), 거부는 SC_ITEM_RESULT(request = CS_PICKUP_ITEM).
message CS_PICKUP_ITEM_PACKET {
	int32 object_id = 1;    // 드랍 오브젝트 id (SC_ADD_OBJECT로 받은 OBJECT_TYPE_ITEM)
}

// 버리기(A3.5, D-155). 인벤토리 위치의 행을 스택 통째로 내 발밑에 소유권 없는 드랍으로 떨어뜨린다.
// 성공은 SC_INVENTORY_UPDATE(removed) + SC_ADD_OBJECT, 거부는 SC_ITEM_RESULT(request = CS_DROP_ITEM).
message CS_DROP_ITEM_PACKET {
	int64 item_db_id = 1;   // 버릴 행 (인벤토리 위치의 내 아이템, 장착 중인 것은 안 됨)
}

// 소비 아이템 사용(A3.6, D-154). 성공은 SC_USE_ITEM(AOI) + SC_INVENTORY_UPDATE(본인), 거부는 SC_ITEM_RESULT(request = CS_USE_ITEM).
message CS_USE_ITEM_PACKET {
	int64 item_db_id = 1;   // 쓸 행(인벤토리 위치의 내 아이템). 0이면 서버가 item_id 종류 중 수량이 적은 스택부터 고른다(액티브 칸)
	int32 item_id = 2;      // item_db_id가 0일 때만 본다
}

// 액티브 칸 배치(A3.6). 칸에는 아이템 종류를 올린다. 성공은 SC_INVENTORY_UPDATE(quick_slots), 거부는 SC_ITEM_RESULT(request = CS_SET_QUICKSLOT).
message CS_SET_QUICKSLOT_PACKET {
	int32 slot = 1;         // 칸 번호 1~5 (숫자키)
	int32 item_id = 2;      // 올릴 아이템 종류(ItemTable ID, UseEffect가 있는 것). 0 = 비우기
}

// 인벤토리 칸 옮기기(A6.1). 대상 칸이 비어 있으면 옮기고, 다른 아이템이 있으면 두 칸을 맞바꾼다.
// 성공은 SC_INVENTORY_UPDATE(바뀐 행), 거부는 SC_ITEM_RESULT(request = CS_MOVE_ITEM).
message CS_MOVE_ITEM_PACKET {
	int64 item_db_id = 1;   // 옮길 행 (인벤토리 위치의 내 아이템)
	int32 to_slot = 2;      // 대상 칸 번호(0 ~ max_slots - 1)
}

// ---- 상점 NPC (L4, D-201·D-202). 요청마다 서버가 거리·거래 중·사망을 다시 검증한다. 거부는 SC_ITEM_RESULT(request = 요청 패킷 id) ----
// 품목 요청. 성공은 SC_SHOP_OPEN.
message CS_SHOP_OPEN_PACKET {
	int32 npc_id = 1;       // 상점 NPC의 오브젝트 id (SC_ADD_OBJECT로 받은 OBJECT_TYPE_NPC)
}

// 구매. 성공은 SC_INVENTORY_UPDATE(바뀐 행 + 골드).
message CS_SHOP_BUY_PACKET {
	int32 npc_id = 1;
	int32 item_id = 2;      // 그 상점의 품목(ShopTable)
	int32 count = 3;        // 1 이상
}

// 판매. 성공은 SC_INVENTORY_UPDATE(바뀐 행 또는 removed + 골드). 판 아이템은 사라진다(되사기 없음).
message CS_SHOP_SELL_PACKET {
	int32 npc_id = 1;
	int64 item_db_id = 2;   // 팔 행 (인벤토리 위치의 내 아이템, 장착 중인 것은 안 됨)
	int32 count = 3;        // 1 ~ 그 행의 수량 (스택 일부만 팔 수 있다)
}

// 포털 사용 요청(L5, D-203). 도착지는 서버가 정한다. 성공은 SC_TELEPORT, 거부(없는 포털·거리 밖·사망·시전 중·너무 잦음)는 응답 없이 버린다.
// 경매 검색 (A4.3). 던전 밖 어디서나. 응답은 SC_AUCTION_LIST, 거부는 SC_AUCTION_RESULT.
message CS_AUCTION_SEARCH_PACKET {
	int32 slot = 1;         // 0 = 전체, 1~7 = 장비 슬롯(EquipPart), 8 = 소비·그 밖(슬롯 없는 아이템)
	int32 page = 2;         // 0부터. 가격 오름차순으로 EconomyTable.AuctionPageSize개씩
}

// 경매 등록 (경매 NPC 근처에서만, D-234). 성공하면 그 수량이 인벤토리에서 빠진다(SC_INVENTORY_UPDATE + SC_AUCTION_RESULT).
message CS_AUCTION_REGISTER_PACKET {
	int32 npc_id = 1;       // 경매 NPC의 오브젝트 id
	int64 item_db_id = 2;   // 올릴 행 (인벤토리 위치의 내 아이템, 장착 중·거래에 올린 것은 안 됨)
	int32 count = 3;        // 1 ~ 그 행의 수량 (스택 일부만 올릴 수 있다)
	int64 price = 4;        // 묶음 전체의 값 (EconomyTable.AuctionMinPrice ~ AuctionMaxPrice)
}

// 즉시 구매 (던전 밖 어디서나). 골드만 줄고 산 물건은 수령함으로 간다.
message CS_AUCTION_BUY_PACKET {
	int64 listing_id = 1;
}

// 내 등록 취소 (경매 NPC 근처에서만). 아이템은 수령함으로 간다.
message CS_AUCTION_CANCEL_PACKET {
	int32 npc_id = 1;
	int64 listing_id = 2;
}

// 내 등록 + 수령함 조회 (던전 밖 어디서나). 응답은 SC_AUCTION_MY.
message CS_AUCTION_MY_PACKET {
}

// 수령함에서 한 건 받기 (경매 NPC 근처에서만). 아이템은 빈 칸으로, 골드는 상한 안에서.
message CS_MAIL_CLAIM_PACKET {
	int32 npc_id = 1;
	int64 mail_id = 2;
}

message CS_PORTAL_PACKET {
	int32 portal_id = 1;    // SC_PORTAL_LIST로 받은 포털 id (맵 마커 pointId)
}

// ---- 1:1 거래 (A4.2, D-158). 거부는 SC_TRADE_RESULT(request = 요청 패킷 id), 진행은 SC_TRADE_STATE, 끝은 SC_TRADE_END ----
message CS_TRADE_REQUEST_PACKET {
	int32 target_id = 1;                 // 거래할 플레이어의 오브젝트 id (같은 방, 거리 안)
}

message CS_TRADE_RESPOND_PACKET {
	bool accept = 1;
}

// 내 제시 전체를 이 내용으로 바꾼다. 누가 제시를 바꾸면 양쪽의 잠금·확정이 풀린다.
message CS_TRADE_SET_OFFER_PACKET {
	repeated TradeOfferItem items = 1;   // (item_db_id, count). 인벤토리 위치의 내 아이템, 같은 행은 한 번만
	int64 gold = 2;
}

message CS_TRADE_LOCK_PACKET {
	bool locked = 1;                     // false = 풀기(양쪽의 잠금·확정이 모두 풀린다)
}

message CS_TRADE_CONFIRM_PACKET {
}

message CS_TRADE_CANCEL_PACKET {
}

// ---- 파티 (DG2, D-217). 거부·초대 결과는 SC_PARTY_RESULT(request = 요청 패킷 id), 성사·변화는 SC_PARTY_STATE ----
// 파티가 없는 사람 또는 파티장만 보낼 수 있다. 상대가 수락하면 파티가 없던 사람은 파티장이 된다.
message CS_PARTY_INVITE_PACKET {
	int32 target_id = 1;                 // 초대할 플레이어의 오브젝트 id. 0이면 target_name으로 찾는다
	string target_name = 2;              // 캐릭터 이름 (다른 Room에 있어도 됨, 같은 채널만)
}

message CS_PARTY_RESPOND_PACKET {
	bool accept = 1;
}

message CS_PARTY_LEAVE_PACKET {
}

// 스킬 조준(숫자키 → 범위 선택) 켜기/끄기. 상태가 바뀔 때만 보낸다.
// 확정(CS_ATTACK)은 서버가 조준을 함께 해제하므로 끄기를 따로 보내지 않는다.
message CS_SKILL_AIM_PACKET {
	int32 slot = 1;     // 1~5 = 스킬 슬롯 (서버가 장착 무기 타입의 SkillTable로 해석)
	bool active = 2;
	uint32 seq = 3;     // 클라가 켜기/끄기를 보낼 때마다 1씩 올린다. 서버가 본인에게 보내는 거부·시간 초과에 그대로 돌려준다
}

// 서버 JobQueue 지연까지 포함한 왕복 시간 측정용. client_time은 서버가 그대로 돌려준다.
message CS_PING_PACKET {
	int64 client_time = 1;
}

// 부활 요청. 내용 없음 — 위치·HP는 서버가 정한다. 살아 있거나 대기 시간 전이면 서버가 조용히 버린다.
message CS_REVIVE_PACKET {
}

// ==========================================
//  Server -> Client
// ==========================================

message SC_LOGIN_INFO_PACKET {
	ObjectInfo object_info = 1;   // result가 SUCCESS일 때만 채워진다
	LoginResult result = 2;
	string map_name = 3;          // 들어갈 레벨 이름(서버 ServerConfig [World] MapName). result가 SUCCESS일 때만 채워진다. 클라이언트는 이 이름의 레벨을 연다 (L2e, D-185)
}

message SC_SIGNUP_PACKET {
	bool result = 1;   // false: 중복 ID, 잘못된 체형(MALE/FEMALE 외), 이미 로그인한 연결 등
}

message SC_ADD_OBJECT_PACKET {
	ObjectInfo object_info = 1;
}

message SC_REMOVE_OBJECT_PACKET {
	int32 object_id = 1;
}

message SC_CHAT_PACKET {
	int32 sender_id = 1;
	string message = 2;      // UTF-8, 서버가 검증·자른 내용
	string sender_name = 3;  // UTF-8 캐릭터 이름(Player_Info.Name)
}

message SC_MOVE_PACKET {
	ObjectInfo object_info = 1;
	uint32 move_time = 2; 
	uint32 correction_seq = 3; // 내 캐릭터 보정일 때만 의미 있음(서버가 이동을 거부할 때마다 +1)
}

message SC_ATTACK_PACKET {
	int32 attacker_id = 1;
	int32 skill_id = 2;
	int32 target_id = 3;
	float aim_yaw = 4;       // 서버가 확정한 시전 방향
	float aim_x = 5;         // 서버가 사거리로 보정한 지면 목표 지점
	float aim_y = 6;
	int32 cooldown_ms = 7;   // 서버가 적용한 이 스킬의 쿨타임(SkillTable.CooldownMs). 클라이언트 쿨타임 표시용
	uint32 seq = 8;          // 시전자가 보낸 CS_ATTACK.seq (몬스터는 0). 시전자 본인만 쓴다: 입력 때 먼저 시작한 시전과 같으면 다시 재생하지 않는다 (CP1)
}

// 스킬·공격 거부. 본인에게만, 거부일 때만 보낸다(성공은 SC_ATTACK). 형식이 틀린 요청(칸 범위 밖·NaN)은 응답 없이 버린다. (CP1, D-211)
message SC_ATTACK_RESULT_PACKET {
	AttackResult result = 1;
	uint32 seq = 2;          // 거부된 CS_ATTACK.seq
	int32 skill_slot = 3;
	int32 remain_ms = 4;     // ACTING·COOLDOWN일 때 서버 기준 남은 시간(그 밖은 0). 클라이언트가 로컬 시각을 서버에 맞추는 데 쓴다
}

message SC_DAMAGE_PACKET {
	int32 attacker_id = 1;
	int32 target_id = 2;
	int32 damage = 3;
	int32 remain_hp = 4;
}

message SC_DEAD_PACKET {
	int32 object_id = 1;
	int32 revive_delay_ms = 2;   // 플레이어만: 이 시간이 지나야 부활 요청을 받는다(WorldTable.ReviveDelaySec). 몬스터는 0
}

// 플레이어 부활. AOI 전체(본인 포함)에 방송한다. 위치·HP는 서버가 정한 값.
message SC_REVIVE_PACKET {
	int32 object_id = 1;
	PositionInfo pos_info = 2;
	int32 hp = 3;
	uint32 correction_seq = 4;   // 본인용: 부활로 올라간 이동 보정 순번(이후 CS_MOVE에 싣는다). 다른 사람에게는 의미 없음
}

// 서버가 정한 자리로 순간이동(L5, D-203 — 포털). 떠나는 자리에서 보던 사람들(본인 포함)에게 방송한다.
// 받은 쪽은 보간 없이 위치를 바꾼다. 새 자리에서 처음 보게 된 사람은 SC_ADD_OBJECT로 받는다.
message SC_TELEPORT_PACKET {
	int32 object_id = 1;
	PositionInfo pos_info = 2;
	uint32 correction_seq = 3;   // 본인용: 이동으로 올라간 이동 보정 순번(이후 CS_MOVE에 싣는다). 다른 사람에게는 의미 없음
}

// 포털 하나 (L5). 위치는 cm, 이 반경 안에서 CS_PORTAL을 보낼 수 있다.
message PortalInfo {
	int32 portal_id = 1;
	float x = 2;
	float y = 3;
	float z = 4;
	float radius_cm = 5;
	PortalKind kind = 6;   // 안내 문구 구분(DG3c)
}

// 던전 인스턴스 상태(DG3c, D-218). 입장을 마친 직후 본인에게 한 번, 우두머리를 잡으면 안에 있는 전원에게.
message SC_DUNGEON_STATE_PACKET {
	DungeonState state = 1;
	int32 remain_sec = 2;    // CLEARED일 때: 마을로 내보내기까지 남은 시간(초). 그 밖은 0
}

// 방 입장 직후 본인에게 한 번(L5). 지금 쓸 수 있는 포털만 담는다(도착지가 없는 포털은 빠진다).
message SC_PORTAL_LIST_PACKET {
	repeated PortalInfo portals = 1;
}

// Room을 옮겼다(DG3b, D-216 — 문 포털, 사냥터에서 죽은 뒤 부활). 본인에게만, 새 Room의 SC_ADD_OBJECT·SC_PORTAL_LIST보다 먼저 온다.
// 받은 쪽: map_name이 지금 레벨과 같으면 내 캐릭터를 뺀 오브젝트·포털을 지우고 pos_info로 옮긴다(레벨을 다시 열지 않음).
// 다르면 그 레벨을 열고 CS_ENTER_ROOM을 보낸다(DG3c).
message SC_ROOM_CHANGE_PACKET {
	string map_name = 1;
	RoomKind kind = 2;
	int32 channel = 3;
	PositionInfo pos_info = 4;
	uint32 correction_seq = 5;   // 이동으로 올라간 이동 보정 순번(이후 CS_MOVE에 싣는다)
}

// Room 이동 거부(본인에게만, 거부일 때만).
message SC_MOVE_RESULT_PACKET {
	MoveResult result = 1;
}

// 장착 성공을 AOI 전체에 방송한다. stat = 장비 반영 후 최종 스탯(서버 계산).
message SC_CHANGE_EQUIP_PACKET {
	int32 object_id = 1;
	EquipPart part = 2;
	int32 item_id = 3;        // 0 = 해제
	StatInfo stat = 4;
}

// 장착 거부를 요청한 본인에게만 보낸다.
message SC_CHANGE_EQUIP_RESULT_PACKET {
	EquipResult result = 1;
	EquipPart part = 2;
	int32 item_id = 3;       // 서버가 아는 경우에만(요청한 행의 종류). 모르면 0
	int64 item_db_id = 4;    // 요청에 실린 값 그대로
}

// 방 입장 직후 본인에게 한 번(A3.3). 더미 봇에는 보내지 않는다(D-164).
message SC_INVENTORY_PACKET {
	repeated ItemInfo items = 1;        // 인벤토리 + 장착 전체 (item_db_id 순)
	int64 gold = 2;
	int32 max_slots = 3;                // EconomyTable.InventorySlots (장착품은 칸을 차지하지 않는다)
	int32 pickup_range_cm = 4;          // EconomyTable.PickupRangeCm (A3.5·A6.2에서 사용)
	int32 trade_range_cm = 5;           // EconomyTable.TradeRangeCm (A4·A6.3a에서 사용)
	int32 shop_range_cm = 7;            // EconomyTable.ShopRangeCm (L4)
	repeated int32 quick_slots = 6;     // 액티브 칸 1~5에 올린 item_id 5개(빈 칸 0) (A3.6)
}

// 아이템·골드가 바뀔 때마다 본인에게(A3.3). DB 성공 뒤의 값이다.
message SC_INVENTORY_UPDATE_PACKET {
	repeated ItemInfo changed = 1;      // 새로 생겼거나 값이 바뀐 행(최종 상태)
	repeated int64 removed = 2;         // 지워진 item_db_id
	int64 gold = 3;                     // 현재 골드(바뀌지 않았어도 항상 채움)
	repeated int32 quick_slots = 4;     // 액티브 칸 배치가 바뀌었을 때만: 칸 1~5의 item_id 5개(빈 칸 0). 비어 있으면 바뀌지 않음 (A3.6)
}

// 소비 아이템을 썼다(A3.6). AOI 방송(본인 포함). 수량은 본인에게 SC_INVENTORY_UPDATE로 따로 간다.
message SC_USE_ITEM_PACKET {
	int32 object_id = 1;                // 쓴 플레이어
	int32 item_id = 2;                  // 쓴 아이템 종류
	int32 hp = 3;                       // 사용 뒤 HP
	int32 cooldown_ms = 4;              // 그 종류의 재사용 시간(ItemTable.UseCooldownMs, 서버 값). 본인의 칸 표시에 쓴다
}

// 피해(SC_DAMAGE)·아이템 사용(SC_USE_ITEM)이 아닌 HP 변화(L3, D-193). 클라이언트는 피격 연출 없이 HP만 반영한다.
message SC_CHANGE_HP_PACKET {
	int32 object_id = 1;
	int32 hp = 2;                       // 바뀐 뒤 HP
}

// 아이템 요청 거부를 요청한 본인에게만 보낸다(장착 거부는 SC_CHANGE_EQUIP_RESULT).
message SC_ITEM_RESULT_PACKET {
	PacketId request = 1;               // 거부된 요청의 패킷 id (CS_DEV_GIVE 등)
	ItemResult result = 2;
}

// 상점 품목 한 줄 (L4). 판매가는 클라이언트가 ItemTable.SellPrice로 표시한다(계산은 서버).
message ShopItem {
	int32 item_id = 1;
	int64 buy_price = 2;                // 1개 값 (ShopTable.BuyPrice)
}

// CS_SHOP_OPEN의 응답(본인). 받은 클라이언트가 상점 창을 연다.
message SC_SHOP_OPEN_PACKET {
	int32 npc_id = 1;
	repeated ShopItem items = 2;        // ShopTable 행 순서
}

// 경매 검색 결과 한 쪽 (본인, A4.3)
message SC_AUCTION_LIST_PACKET {
	int32 slot = 1;                           // 요청한 필터
	int32 page = 2;                           // 이 쪽 번호(0부터). 요청한 쪽이 범위를 넘으면 마지막 쪽
	int32 total_count = 3;                    // 이 필터의 판매 중인 등록 수
	int32 page_size = 4;                      // EconomyTable.AuctionPageSize
	repeated AuctionListingInfo listings = 5; // 가격 오름차순
}

// 내 등록 + 수령함 (본인, A4.3)
message SC_AUCTION_MY_PACKET {
	repeated AuctionListingInfo listings = 1; // 내가 올린 판매 중인 등록
	repeated MailInfo mails = 2;              // 수령함 — 오래된 것부터 page_size개
	bool mail_more = 3;                       // 보낸 것보다 더 있다(받으면 다음 것이 보인다)
	int32 max_listings = 4;                   // EconomyTable.AuctionMaxListings
	int64 min_price = 5;                      // EconomyTable.AuctionMinPrice
	int64 max_price = 6;                      // EconomyTable.AuctionMaxPrice
}

// 경매 요청의 결과 (본인, A4.3). 성공·거부 모두 보낸다. 검색·내 목록의 성공은 SC_AUCTION_LIST·SC_AUCTION_MY가 대신한다.
message SC_AUCTION_RESULT_PACKET {
	PacketId request = 1;                     // 요청의 패킷 id
	AuctionResult result = 2;
	int64 id = 3;                             // 대상 listing_id (등록 성공이면 새 등록의 id, 수령이면 mail_id)
}

// 스킬 조준 상태. 켜기 = AOI 방송(본인 포함), 클라 취소·시전 실패 해제 = 본인 제외 방송,
// 거부 = 본인에게만(active=false, seq), 시간 초과 = 본인(seq 포함) + 다른 사람.
// 확정·사망·무기 교체 해제는 보내지 않는다(원격 클라는 SC_ATTACK·SC_DEAD·SC_CHANGE_EQUIP으로 해제).
message SC_SKILL_AIM_PACKET {
	int32 object_id = 1;
	int32 skill_id = 2;   // 꺼질 때는 0일 수 있음
	bool active = 3;
	uint32 seq = 4;       // 본인에게 보내는 거부·시간 초과에만 채움 (그 밖은 0)
}

message SC_PONG_PACKET {
	int64 client_time = 1;
}

// 거래 요청을 받았다(A4.2). timeout_sec 안에 CS_TRADE_RESPOND로 답하지 않으면 서버가 취소한다(SC_TRADE_END TIMEOUT).
message SC_TRADE_REQUEST_PACKET {
	int32 from_id = 1;                   // 요청한 플레이어의 오브젝트 id
	string from_name = 2;
	int32 timeout_sec = 3;               // EconomyTable.TradeRequestTimeoutSec
}

// 거래 상태 전체(A4.2). 두 사람에게 같은 내용을 보낸다. offers[0] = 요청한 쪽, offers[1] = 받은 쪽.
message SC_TRADE_STATE_PACKET {
	TradePhase phase = 1;
	repeated TradeOffer offers = 2;
}

// 거래가 끝났다(A4.2). SUCCESS면 아이템·골드는 SC_INVENTORY_UPDATE로 따로 온다. 그 밖에는 바뀐 것이 없다.
message SC_TRADE_END_PACKET {
	TradeResult result = 1;
}

// 거래 요청이 거부됐다(본인에게). 확정 재검증 실패는 두 사람 모두에게 오고 거래는 제시 단계로 돌아간다.
message SC_TRADE_RESULT_PACKET {
	PacketId request = 1;                // 거부된 요청의 패킷 id
	TradeResult result = 2;
}

// 파티 초대를 받았다(DG2). timeout_sec 안에 CS_PARTY_RESPOND로 답하지 않으면 서버가 지운다(양쪽에 SC_PARTY_RESULT TIMEOUT).
message SC_PARTY_INVITE_PACKET {
	int32 from_id = 1;                   // 초대한 플레이어의 오브젝트 id
	string from_name = 2;
	int32 timeout_sec = 3;               // EconomyTable.PartyInviteTimeoutSec
}

// 파티원 한 명. 다른 Room에 있을 수 있어 이름·레벨·있는 곳을 서버가 보낸다.
message PartyMember {
	int32 id = 1;                        // 오브젝트 id
	string name = 2;
	int32 level = 3;
	RoomKind kind = 4;                   // 지금 있는 Room의 종류 (마을·사냥터·던전)
}

// 파티 전체(DG2). 구성·파티장·파티원이 있는 곳이 바뀔 때마다 전원에게 같은 내용을 보낸다.
// members가 비어 있으면 "파티 없음"(탈퇴·해산) — 그때 party_id·leader_id는 0. members는 들어온 순서.
message SC_PARTY_STATE_PACKET {
	int32 party_id = 1;
	int32 leader_id = 2;                 // 파티장의 오브젝트 id
	repeated PartyMember members = 3;
}

// 파티 요청이 거부됐거나(본인에게) 보낸 초대의 결과(DECLINED·TIMEOUT)가 나왔다.
message SC_PARTY_RESULT_PACKET {
	PacketId request = 1;                // 관련 요청의 패킷 id
	PartyResult result = 2;
}

// 서버가 이 연결을 끊기 직전에 본인에게 보낸다(A2.7). 받은 클라이언트는 스스로 연결을 닫고 로그인 화면으로 돌아간다.
// 전송 중이던 패킷이 있으면 도착하지 않을 수 있으므로, 클라이언트는 이 패킷 없이 끊겨도 같은 처리를 해야 한다.
message SC_KICK_PACKET {
	KickReason reason = 1;
}
